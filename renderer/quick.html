<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>XAI Quick Entry</title>
<style>
  html, body { margin: 0; background: transparent; font: 15px "Segoe UI Variable Text", "Segoe UI", sans-serif; overflow: hidden; }
  .bar { margin: 8px; height: 58px; display: flex; align-items: center; gap: 12px; padding: 0 10px 0 16px; border-radius: 16px; background: #23242a; color: #ececee; box-shadow: 0 10px 30px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.08); }
  @media (prefers-color-scheme: light) { .bar { background: #fff; color: #1d1f23; box-shadow: 0 10px 30px rgba(20,20,40,.25), 0 0 0 1px rgba(0,0,0,.08); } input::placeholder { color: #8b8f96; } }
  input { flex: 1; border: 0; outline: 0; background: transparent; color: inherit; font: inherit; font-size: 16px; }
  input::placeholder { color: #80848c; }
  button { width: 36px; height: 36px; border: 0; border-radius: 10px; background: linear-gradient(135deg,#4f46e5,#7c3aed 55%,#06b6d4); color: #fff; cursor: pointer; display: grid; place-items: center; }
  kbd { font: 11px "Segoe UI"; opacity: .5; }
</style>
</head>
<body>
<div class="bar">
  <svg width="24" height="24" viewBox="96 96 320 320"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4F46E5"/><stop offset=".55" stop-color="#7C3AED"/><stop offset="1" stop-color="#06B6D4"/></linearGradient></defs><path d="M256 214Q296 134 384 128Q378 216 298 256Q378 296 384 384Q296 378 256 298Q216 378 128 384Q134 296 214 256Q134 216 128 128Q216 134 256 214Z" fill="url(#g)"/></svg>
  <input id="q" placeholder="Ask XAI anything..." autofocus>
  <kbd>Esc to close</kbd>
  <button id="go" title="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
</div>
<script>
  const q = document.getElementById('q');
  const send = () => { const t = q.value.trim(); if (t) { xai.quickSubmit(t); q.value = ''; } };
  q.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); if (e.key === 'Escape') xai.quickClose(); });
  document.getElementById('go').onclick = send;
  window.addEventListener('focus', () => q.focus());
</script>
</body>
</html>
